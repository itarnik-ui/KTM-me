<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTM Construction Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
          const [activeTab, setActiveTab] = React.useState('projects');
          const [currentUser, setCurrentUser] = React.useState({ name: 'คุณเม (Admin / MD)', role: 'admin' });
          const [showForm, setShowForm] = React.useState(false);
          const [editingId, setEditingId] = React.useState(null);
          const [showNotices, setShowNotices] = React.useState(true);

          const [showTestModal, setShowTestModal] = React.useState(false);
          const [currentProjForTest, setCurrentProjForTest] = React.useState(null);
          const [testForm, setTestForm] = React.useState({
            testType: 'เทสลูกปูน',
            sendDate: '',
            resultDate: '',
            specDetail: '',
            status: 'รอผลแล็บ'
          });

          const defaultProjects = [
            {
              id: 1,
              name: 'โครงการก่อสร้างรางระบายน้ำ คสล. สาย ก',
              client: 'เทศบาลนครนครราชสีมา',
              budget: 2450000,
              stage: '3. ส่งเทสวัสดุ / รอผลแล็บ',
              agingDays: 18,
              paymentStatus: 'กำลังดำเนินการหน้างาน',
              defectNote: 'ส่งตัวอย่างคอนกรีตคสล. รอบที่ 2 รอผลแล็บ',
              finalHandoverDate: '',
              tests: [
                { id: 101, testType: 'เทสลูกปูน', sendDate: '2026-11-01', resultDate: '', specDetail: 'กำลัง 7 วัน (3 ก้อน)', status: 'รอผลแล็บ' },
                { id: 102, testType: 'เทสเหล็ก', sendDate: '2026-10-20', resultDate: '2026-10-25', specDetail: 'DB12 มอก. SR24', status: 'ผ่าน/ออกผลแล้ว' }
              ]
            }
          ];

          const [projects, setProjects] = React.useState(() => {
            const saved = localStorage.getItem('ktm_projects_v6');
            if (saved) return JSON.parse(saved);
            const oldV5 = localStorage.getItem('ktm_projects_v5');
            return oldV5 ? JSON.parse(oldV5) : defaultProjects;
          });

          React.useEffect(() => {
            localStorage.setItem('ktm_projects_v6', JSON.stringify(projects));
          }, [projects]);

          const emptyForm = {
            name: '',
            client: '',
            budget: '',
            stage: '1. เตรียมการ / ออกหนังสือเข้าหน้างาน',
            paymentStatus: 'กำลังดำเนินการหน้างาน',
            agingDays: 0,
            defectNote: '-',
            finalHandoverDate: ''
          };

          const [formData, setFormData] = React.useState(emptyForm);

          const openAddForm = () => {
            setEditingId(null);
            setFormData(emptyForm);
            setShowForm(true);
          };

          const openEditForm = (proj) => {
            setEditingId(proj.id);
            setFormData({
              name: proj.name,
              client: proj.client,
              budget: proj.budget,
              stage: proj.stage || '1. เตรียมการ / ออกหนังสือเข้าหน้างาน',
              paymentStatus: proj.paymentStatus,
              agingDays: proj.agingDays,
              defectNote: proj.defectNote,
              finalHandoverDate: proj.finalHandoverDate
            });
            setShowForm(true);
          };

          const handleSaveProject = (e) => {
            e.preventDefault();
            if (!formData.name || !formData.client) return;

            const existingProj = projects.find(p => p.id === editingId);
            const projectPayload = {
              id: editingId ? editingId : Date.now(),
              name: formData.name,
              client: formData.client,
              budget: Number(formData.budget) || 0,
              stage: formData.stage,
              agingDays: Number(formData.agingDays) || 0,
              paymentStatus: formData.paymentStatus,
              defectNote: formData.defectNote || '-',
              finalHandoverDate: formData.finalHandoverDate,
              tests: existingProj ? existingProj.tests || [] : []
            };

            if (editingId) {
              setProjects(projects.map(p => p.id === editingId ? projectPayload : p));
            } else {
              setProjects([projectPayload, ...projects]);
            }

            setShowForm(false);
            setEditingId(null);
            setFormData(emptyForm);
          };

          const handleDeleteProject = (id) => {
            if (confirm('ยืนยันการลบโครงการนี้?')) {
              setProjects(projects.filter(p => p.id !== id));
            }
          };

          const handleAddTestItem = (e) => {
            e.preventDefault();
            if (!currentProjForTest || !testForm.sendDate) return;

            const newTest = {
              id: Date.now(),
              testType: testForm.testType,
              sendDate: testForm.sendDate,
              resultDate: testForm.resultDate,
              specDetail: testForm.specDetail || '-',
              status: testForm.resultDate ? 'ผ่าน/ออกผลแล้ว' : 'รอผลแล็บ'
            };

            setProjects(projects.map(p => {
              if (p.id === currentProjForTest.id) {
                return { ...p, tests: [...(p.tests || []), newTest] };
              }
              return p;
            }));

            setShowTestModal(false);
            setTestForm({ testType: 'เทสลูกปูน', sendDate: '', resultDate: '', specDetail: '', status: 'รอผลแล็บ' });
          };

          const handleDeleteTestItem = (projId, testId) => {
            if (confirm('ลบรายการทดสอบนี้?')) {
              setProjects(projects.map(p => {
                if (p.id === projId) {
                  return { ...p, tests: p.tests.filter(t => t.id !== testId) };
                }
                return p;
              }));
            }
          };

          const calculateDaysPassed = (dateStr) => {
            if (!dateStr) return null;
            const target = new Date(dateStr);
            target.setHours(0, 0, 0, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffTime = today - target;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
          };

          const calculateDeadlines = (handoverDateStr) => {
            if (!handoverDateStr) return { kFactorDeadline: '-', warrantyDeadline: '-', daysLeftK: null, daysLeftWarranty: null };
            const handoverDate = new Date(handoverDateStr);
            handoverDate.setHours(0, 0, 0, 0);
            
            const kDate = new Date(handoverDate);
            kDate.setDate(kDate.getDate() + 90);
            
            const warrantyDate = new Date(handoverDate);
            warrantyDate.setFullYear(warrantyDate.getFullYear() + 2);
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const daysLeftK = Math.ceil((kDate - today) / (1000 * 60 * 60 * 24));
            const daysLeftWarranty = Math.ceil((warrantyDate - today) / (1000 * 60 * 60 * 24));
            
            return {
              kFactorDeadline: kDate.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }),
              warrantyDeadline: warrantyDate.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' }),
              daysLeftK,
              daysLeftWarranty
            };
          };

          const getNotices = () => {
            const list = [];
            projects.forEach(p => {
              if (p.tests && p.tests.length > 0) {
                p.tests.forEach(t => {
                  if (t.sendDate && !t.resultDate) {
                    const days = calculateDaysPassed(t.sendDate);
                    if (days >= 7) {
                      list.push({
                        id: `test-${p.id}-${t.id}`,
                        level: days >= 14 ? 'urgent' : 'warning',
                        category: '🧪 ติดตามผลแล็บ',
                        project: p.name,
                        message: `รายการ "${t.testType}" (${t.specDetail}) ส่งมาแล้ว ${days} วัน ยังไม่ได้รับผล`,
                        projObj: p
                      });
                    }
                  }
                });
              }

              if (p.paymentStatus !== 'รับเงินงวดเรียบร้อย' && p.agingDays >= 15) {
                list.push({
                  id: `pay-${p.id}`,
                  level: p.agingDays >= 30 ? 'urgent' : 'warning',
                  category: '💰 ติดตามเงินงวด',
                  project: p.name,
                  message: `สถานะ "${p.paymentStatus}" รอเงินมาแล้ว ${p.agingDays} วัน`,
                  projObj: p
                });
              }

              if (p.finalHandoverDate) {
                const d = calculateDeadlines(p.finalHandoverDate);
                if (d.daysLeftK !== null && d.daysLeftK <= 30) {
                  list.push({
                    id: `k-${p.id}`,
                    level: d.daysLeftK <= 15 ? 'urgent' : 'warning',
                    category: '⚠️ เดดไลน์ค่า K',
                    project: p.name,
                    message: d.daysLeftK < 0 ? `เลยกำหนดยื่นขอค่า K มา ${Math.abs(d.daysLeftK)} วัน!` : `เหลือเวลาอีก ${d.daysLeftK} วัน ครบกำหนด 90 วัน`,
                    projObj: p
                  });
                }
              }
            });
            return list;
          };

          const notices = getNotices();

          return (
            <div className="max-w-4xl mx-auto space-y-5 pb-12">
              <header className="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-3">
                <div>
                  <h1 className="text-xl font-bold text-amber-400">🏗️ KTM Construction Tracker</h1>
                  <p className="text-xs text-slate-400">ระบบติดตามโครงการ นับวัน และเช็คผลเทสตาม BOQ อัตโนมัติ</p>
                </div>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setShowNotices(!showNotices)}
                    className={`relative px-3 py-2 rounded-lg text-sm font-bold border ${notices.length > 0 ? 'bg-red-500/20 border-red-500/50 text-red-300' : 'bg-slate-900 border-slate-700 text-slate-400'}`}
                  >
                    🔔 Notice ({notices.length})
                  </button>
                  <select 
                    className="bg-slate-900 text-amber-300 text-sm p-2 rounded-lg border border-slate-700"
                    value={currentUser.role}
                    onChange={(e) => {
                      const r = e.target.value;
                      if (r === 'admin') setCurrentUser({ name: 'คุณเม (Admin)', role: 'admin' });
                      else if (r === 'engineer') setCurrentUser({ name: 'วิศวกรสนาม', role: 'engineer' });
                      else setCurrentUser({ name: 'ฝ่ายบัญชี/เอกสาร', role: 'office' });
                    }}
                  >
                    <option value="admin">👑 คุณเม (Admin / MD)</option>
                    <option value="engineer">👷‍♂️ วิศวกรสนาม</option>
                    <option value="office">📊 ฝ่ายบัญชี/เอกสาร</option>
                  </select>
                </div>
              </header>

              {showNotices && notices.length > 0 && (
                <div className="bg-slate-800/90 border-2 border-red-500/40 rounded-2xl p-4 space-y-2.5 shadow-lg">
                  <div className="flex justify-between items-center">
                    <h2 className="text-sm font-bold text-red-400 flex items-center gap-2">
                      🚨 รายการแจ้งเตือนที่ต้องติดตาม ({notices.length} รายการ)
                    </h2>
                    <button onClick={() => setShowNotices(false)} className="text-xs text-slate-400 hover:text-white">ซ่อนแจ้งเตือน</button>
                  </div>
                  <div className="space-y-2">
                    {notices.map(n => (
                      <div key={n.id} className={`p-3 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${n.level === 'urgent' ? 'bg-red-500/15 border-red-500/40' : 'bg-amber-500/15 border-amber-500/40'}`}>
                        <div>
                          <div className="flex items-center gap-2">
                            <span className={`text-xs font-bold px-2 py-0.5 rounded ${n.level === 'urgent' ? 'bg-red-500 text-white' : 'bg-amber-500 text-slate-950'}`}>
                              {n.category}
                            </span>
                            <span className="text-xs font-bold text-white">{n.project}</span>
                          </div>
                          <p className={`text-xs mt-1 font-medium ${n.level === 'urgent' ? 'text-red-200' : 'text-amber-200'}`}>
                            {n.message}
                          </p>
                        </div>
                        <button 
                          onClick={() => openEditForm(n.projObj)}
                          className="self-start sm:self-center text-xs bg-slate-900 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 whitespace-nowrap"
                        >
                          จัดการโครงการ
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex justify-between items-center border-b border-slate-800 pb-3 flex-wrap gap-2">
                <div className="flex gap-2 overflow-x-auto">
                  <button onClick={() => setActiveTab('projects')} className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${activeTab === 'projects' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>📋 โครงการทั้งหมด ({projects.length})</button>
                  <button onClick={() => setActiveTab('testing')} className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${activeTab === 'testing' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>🧪 ระบบเทสตามประเภทถนน</button>
                  <button onClick={() => setActiveTab('financial')} className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${activeTab === 'financial' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>💰 การเงิน & Aging</button>
                  <button onClick={() => setActiveTab('compliance')} className={`px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap ${activeTab === 'compliance' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>⏳ ค่า K & ค้ำประกัน</button>
                </div>
                {currentUser.role !== 'engineer' && (
                  <button onClick={openAddForm} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm shadow">
                    + เพิ่มโครงการใหม่
                  </button>
                )}
              </div>

              {/* Modal เพิ่มรายการทดสอบตามประเภทถนน */}
              {showTestModal && currentProjForTest && (
                <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
                  <form onSubmit={handleAddTestItem} className="bg-slate-800 border-2 border-sky-500 rounded-2xl p-5 space-y-4 max-w-md w-full">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-sky-400 text-base">🧪 บันทึกส่งเทส (ตามประเภทถนน)</h3>
                      <button type="button" onClick={() => setShowTestModal(false)} className="text-slate-400 hover:text-white">✕ ปิด</button>
                    </div>
                    <p className="text-xs text-slate-300">โครงการ: <b className="text-white">{currentProjForTest.name}</b></p>
                    <div className="space-y-3 text-sm">
                      <div>
                        <label className="block text-slate-400 mb-1">ประเภทการทดสอบ *</label>
                        <select className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={testForm.testType} onChange={e => setTestForm({...testForm, testType: e.target.value})}>
                          <optgroup label="🛣️ ถนนคอนกรีตเสริมเหล็ก">
                            <option value="เทสชั้นพื้นทาง">เทสชั้นพื้นทาง</option>
                            <option value="เทสเหล็ก">เทสเหล็ก</option>
                            <option value="ออกแบบ Mix Design">ออกแบบ Mix Design</option>
                            <option value="เทสลูกปูน">เทสลูกปูน</option>
                          </optgroup>
                          <optgroup label="🛤️ ถนนลาดยาง (Asphalt)">
                            <option value="เทสชั้นพื้นทาง (ลาดยาง)">เทสชั้นพื้นทาง</option>
                            <option value="เทส Unconfined">เทส Unconfined</option>
                            <option value="ออกแบบ Job Mix">ออกแบบ Job Mix</option>
                            <option value="เทส Marshall & Coring">เทส Marshall & Coring</option>
                          </optgroup>
                          <optgroup label="📌 อื่นๆ">
                            <option value="อื่นๆ / งานอื่นๆ">อื่นๆ / งานอื่นๆ</option>
                          </optgroup>
                        </select>
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">รายละเอียด / สเปค / Lot (เช่น DB12, กำลัง 7 วัน)</label>
                        <input type="text" placeholder="ระบุรายละเอียด..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={testForm.specDetail} onChange={e => setTestForm({...testForm, specDetail: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">📅 วันที่ส่งหนังสือ / ส่งตัวอย่างแล็บ *</label>
                        <input required type="date" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={testForm.sendDate} onChange={e => setTestForm({...testForm, sendDate: e.target.value})} />
                      </div>
                      <div>
                        <label className="block text-slate-400 mb-1">📅 วันที่ได้รับผลแล็บ (เว้นว่างไว้ถ้ายังไม่มา)</label>
                        <input type="date" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={testForm.resultDate} onChange={e => setTestForm({...testForm, resultDate: e.target.value})} />
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-2.5 rounded-xl">บันทึกรายการเทส</button>
                  </form>
                </div>
              )}

              {showForm && (
                <form onSubmit={handleSaveProject} className="bg-slate-800 border-2 border-emerald-500/50 rounded-2xl p-5 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-emerald-400 text-lg">
                      {editingId ? '✏️ แก้ไขข้อมูลโครงการ' : '➕ เพิ่มโครงการใหม่'}
                    </h3>
                    <button type="button" onClick={() => setShowForm(false)} className="text-slate-400 hover:text-white px-2 py-1">✕ ปิด</button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    <div>
                      <label className="block text-slate-400 mb-1">ชื่อโครงการ *</label>
                      <input required type="text" placeholder="เช่น ถนนคอนกรีต หรือ ถนนลาดยาง..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">หน่วยงานเจ้าของงาน *</label>
                      <input required type="text" placeholder="เช่น เทศบาล / อบจ...." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.client} onChange={e => setFormData({...formData, client: e.target.value})} />
                    </div>
                    {currentUser.role !== 'engineer' && (
                      <div>
                        <label className="block text-slate-400 mb-1">มูลค่าสัญญา (บาท)</label>
                        <input type="number" placeholder="เช่น 3500000" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.budget} onChange={e => setFormData({...formData, budget: e.target.value})} />
                      </div>
                    )}
                    <div>
                      <label className="block text-slate-400 mb-1">ขั้นตอนปัจจุบัน (Stage)</label>
                      <select className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.stage} onChange={e => setFormData({...formData, stage: e.target.value})}>
                        <option value="1. เตรียมการ / ออกหนังสือเข้าหน้างาน">1. เตรียมการ / ออกหนังสือเข้าหน้างาน</option>
                        <option value="2. เริ่มงานก่อสร้างหน้างาน">2. เริ่มงานก่อสร้างหน้างาน</option>
                        <option value="3. ส่งเทสวัสดุ / ออกแบบ Mix Design">3. ส่งเทสวัสดุ / ออกแบบ Mix Design</option>
                        <option value="4. ผลแล็บผ่าน / ดำเนินการต่อ">4. ผลแล็บผ่าน / ดำเนินการต่อ</option>
                        <option value="5. ส่งมอบงาน / ตรวจรับ">5. ส่งมอบงาน / ตรวจรับ</option>
                        <option value="6. วางบิล / รอเบิกจ่ายงวด">6. วางบิล / รอเบิกจ่ายงวด</option>
                        <option value="7. ปิดโครงการ / ค้ำประกัน">7. ปิดโครงการ / ค้ำประกัน</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">สถานะการเงิน / วางบิล</label>
                      <select className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.paymentStatus} onChange={e => setFormData({...formData, paymentStatus: e.target.value})}>
                        <option value="กำลังดำเนินการหน้างาน">กำลังดำเนินการหน้างาน</option>
                        <option value="ส่งมอบงานแล้ว รอตรวจรับ">ส่งมอบงานแล้ว รอตรวจรับ</option>
                        <option value="วางบิลแล้ว รอเงินโอน">วางบิลแล้ว รอเงินโอน</option>
                        <option value="ยื่นหนังสือทวงถามแล้ว">ยื่นหนังสือทวงถามแล้ว</option>
                        <option value="รับเงินงวดเรียบร้อย">รับเงินงวดเรียบร้อย</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">จำนวนวันรอเงินงวด (Aging วัน)</label>
                      <input type="number" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.agingDays} onChange={e => setFormData({...formData, agingDays: e.target.value})} />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">📅 วันที่ตรวจรับงวดสุดท้าย (คำนวณค่า K / 2 ปี)</label>
                      <input type="date" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.finalHandoverDate} onChange={e => setFormData({...formData, finalHandoverDate: e.target.value})} />
                    </div>
                    <div className="md:col-span-2">
                      <label className="block text-slate-400 mb-1">รายละเอียด / หมายเหตุ / Defect</label>
                      <input type="text" placeholder="ระบุรายละเอียดเพิ่มเติม..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" value={formData.defectNote} onChange={e => setFormData({...formData, defectNote: e.target.value})} />
                    </div>
                  </div>
                  <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl">
                    {editingId ? '💾 บันทึกการแก้ไข' : '💾 บันทึกโครงการใหม่'}
                  </button>
                </form>
              )}

              {activeTab === 'projects' && projects.map(p => (
                <div key={p.id} className="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3">
                  <div className="flex justify-between items-start gap-2 flex-wrap">
                    <div>
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-xs bg-blue-500/20 text-blue-300 px-2.5 py-0.5 rounded-full">{p.client}</span>
                        <span className="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full">{p.stage}</span>
                      </div>
                      <h3 className="text-lg font-bold text-white mt-2">{p.name}</h3>
                    </div>
                    <div className="flex items-center gap-2">
                      {currentUser.role !== 'engineer' && (
                        <span className="text-amber-400 font-bold text-sm mr-2">{p.budget.toLocaleString()} บ.</span>
                      )}
                      <button onClick={() => openEditForm(p)} className="text-xs text-sky-300 hover:text-sky-200 bg-sky-500/20 px-3 py-1.5 rounded-lg font-semibold">✏️ แก้ไข</button>
                      {currentUser.role === 'admin' && (
                        <button onClick={() => handleDeleteProject(p.id)} className="text-xs text-red-400 hover:text-red-300 bg-red-500/10 px-2.5 py-1.5 rounded-lg">ลบ</button>
                      )}
                    </div>
                  </div>
                  <div className="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 space-y-2">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-slate-300 font-bold">🧪 รายการส่งเทส ({p.tests ? p.tests.length : 0} รายการ)</span>
                      <button onClick={() => { setCurrentProjForTest(p); setShowTestModal(true); }} className="text-sky-400 hover:text-sky-300 font-bold">+ เพิ่มส่งเทส</button>
                    </div>
                    {p.tests && p.tests.length > 0 ? (
                      <div className="space-y-1.5 pt-1">
                        {p.tests.map(t => {
                          const days = calculateDaysPassed(t.sendDate);
                          const isDone = Boolean(t.resultDate);
                          return (
                            <div key={t.id} className="text-xs bg-slate-800 p-2 rounded-lg flex justify-between items-center gap-2">
                              <div>
                                <span className="text-amber-300 font-semibold">{t.testType}</span> <span className="text-slate-400">({t.specDetail})</span>
                                <div className="text-slate-400 mt-0.5">ส่งเมื่อ: {t.sendDate} {isDone ? <span className="text-emerald-400 ml-2">✓ ออกผลแล้ว ({t.resultDate})</span> : <span className="text-amber-400 ml-2 font-bold">⏳ ผ่านมาแล้ว {days} วัน รอผล</span>}</div>
                              </div>
                              <button onClick={() => handleDeleteTestItem(p.id, t.id)} className="text-red-400 hover:text-red-300 text-xs px-2 py-1">ลบ</button>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="text-xs text-slate-500 italic">ยังไม่มีประวัติการส่งเทส</p>
                    )}
                  </div>
                  <p className="text-sm text-slate-300">🛠️ หมายเหตุ: {p.defectNote}</p>
                  <p className="text-sm text-red-400 font-bold">⏳ สถานะเงินงวด: {p.paymentStatus} (รอ {p.agingDays} วัน)</p>
                </div>
              ))}

              {activeTab === 'testing' && projects.map(p => (
                <div key={p.id} className="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4">
                  <div className="flex justify-between items-center flex-wrap gap-2">
                    <div>
                      <span className="text-xs text-blue-300 bg-blue-500/20 px-2 py-0.5 rounded-full">{p.client}</span>
                      <h3 className="text-lg font-bold text-white mt-1">{p.name}</h3>
                    </div>
                    <button onClick={() => { setCurrentProjForTest(p); setShowTestModal(true); }} className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs px-3 py-2 rounded-xl">
                      + บันทึกส่งเทส (คอนกรีต / ลาดยาง)
                    </button>
                  </div>

                  <div className="space-y-2">
                    {p.tests && p.tests.length > 0 ? (
                      p.tests.map(t => {
                        const days = calculateDaysPassed(t.sendDate);
                        const isDone = Boolean(t.resultDate);
                        return (
                          <div key={t.id} className="bg-slate-900 border border-slate-700 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div className="space-y-1">
                              <div className="flex items-center gap-2">
                                <span className="text-xs font-bold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded">{t.testType}</span>
                                <span className="text-xs text-white font-semibold">{t.specDetail}</span>
                              </div>
                              <p className="text-xs text-slate-300">
                                วันที่ส่ง: <span className="text-white font-medium">{t.sendDate}</span> 
                                {!isDone && days !== null && <span className="text-amber-400 font-bold ml-2">(ผ่านมาแล้ว {days} วัน ยังไม่ได้รับผล)</span>}
                              </p>
                              <p className="text-xs text-slate-300">
                                ผลแล็บ: <span className={isDone ? "text-emerald-400 font-bold" : "text-amber-300 font-bold"}>{isDone ? `ออกผลแล้ววันที่ ${t.resultDate}` : '⏳ รอผลแล็บ'}</span>
                              </p>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={() => openEditForm(p)} className="text-xs bg-slate-800 text-sky-300 border border-slate-600 px-3 py-1.5 rounded-lg">อัปเดตผล</button>
                              <button onClick={() => handleDeleteTestItem(p.id, t.id)} className="text-xs bg-red-500/10 text-red-400 px-2.5 py-1.5 rounded-lg">ลบ</button>
                            </div>
                          </div>
                        );
                      })
                    ) : (
                      <div className="text-center py-6 bg-slate-900/40 rounded-xl border border-dashed border-slate-700">
                        <p className="text-sm text-slate-400">ยังไม่มีรายการทดสอบวัสดุในโครงการนี้</p>
                        <button onClick={() => { setCurrentProjForTest(p); setShowTestModal(true); }} className="mt-2 text-xs text-sky-400 font-bold hover:underline">+ เพิ่มรายการเทสแรก</button>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {activeTab === 'financial' && (
                <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-3">
                  <h3 className="font-bold text-white">สถานะการเบิกจ่ายและ Aging รายโครงการ</h3>
                  {projects.map(p => (
                    <div key={p.id} className="bg-slate-900 p-3 rounded-xl flex justify-between items-center gap-2">
                      <div>
                        <p className="font-semibold text-sm">{p.name}</p>
                        <p className="text-xs text-amber-300">{p.paymentStatus} — รอเงินงวดมาแล้ว <span className="font-bold text-red-400">{p.agingDays}</span> วัน</p>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-amber-400 text-sm">
                          {currentUser.role === 'engineer' ? '🔒 จำกัดสิทธิ์' : `${p.budget.toLocaleString()} บ.`}
                        </span>
                        <button onClick={() => openEditForm(p)} className="text-xs text-sky-300 bg-sky-500/20 px-2.5 py-1 rounded">แก้ไข</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {activeTab === 'compliance' && projects.map(p => {
                const d = calculateDeadlines(p.finalHandoverDate);
                return (
                  <div key={p.id} className="bg-slate-800 border border-slate-700 rounded-2xl p-5 space-y-4">
                    <div className="flex justify-between items-center">
                      <h3 className="font-bold text-white">{p.name}</h3>
                      <button onClick={() => openEditForm(p)} className="text-xs text-sky-300 bg-sky-500/20 px-2.5 py-1 rounded">ใส่วันตรวจรับ</button>
                    </div>
                    <div className="bg-red-500/10 border border-red-500/30 p-3 rounded-xl">
                      <span className="text-xs text-red-400 block font-semibold">⚠️ กำหนดเขตยื่นขอ "ค่า K" (ภายใน 90 วันหลังตรวจรับ)</span>
                      <p className="text-white font-bold">{d.kFactorDeadline} {d.daysLeftK !== null ? `(เหลือเวลาอีก ${d.daysLeftK} วัน)` : '(ยังไม่ระบุวันตรวจรับงวดสุดท้าย)'}</p>
                    </div>
                    <div className="bg-blue-500/10 border border-blue-500/30 p-3 rounded-xl">
                      <span className="text-xs text-blue-300 block font-semibold">🛡️ ครบกำหนดคืน "ค้ำประกันสัญญา & Retention" (2 ปี)</span>
                      <p className="text-white font-bold">{d.warrantyDeadline}</p>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
