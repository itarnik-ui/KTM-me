    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body class="bg-slate-900 text-slate-100 font-sans p-4 md:p-6">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = 'https://uetegeocxmjxcelrbfql.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Ki97QQX_CrCOSlugMFYTrA_sGB85Lqs';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const fromDbRow = (row) => ({
          id: Number(row.id),
          name: row.name || '',
          client: row.client || '',
          budget: Number(row.budget) || 0,
          stage: row.stage || '1. เตรียมการ / ออกหนังสือเข้าหน้างาน',
          agingDays: Number(row.aging_days) || 0,
          paymentStatus: row.payment_status || 'กำลังดำเนินการหน้างาน',
          defectNote: row.defect_note || '-',
          finalHandoverDate: row.final_handover_date || '',
          tests: Array.isArray(row.tests) ? row.tests : []
        });

        const toDbRow = (proj) => ({
          id: Number(proj.id),
          name: proj.name,
          client: proj.client,
          budget: Number(proj.budget) || 0,
          stage: proj.stage,
          aging_days: Number(proj.agingDays) || 0,
          payment_status: proj.paymentStatus,
          defect_note: proj.defectNote || '-',
          final_handover_date: proj.finalHandoverDate || '',
          tests: proj.tests || []
        });

        function App() {
          const [activeTab, setActiveTab] = React.useState('projects');
          const [currentUser, setCurrentUser] = React.useState({ name: 'คุณเม (Admin / MD)', role: 'admin' });
          const [showForm, setShowForm] = React.useState(false);
          const [editingId, setEditingId] = React.useState(null);
          const [showNotices, setShowNotices] = React.useState(true);
          const [syncStatus, setSyncStatus] = React.useState('กำลังเชื่อมต่อ...');
          const [isSaving, setIsSaving] = React.useState(false);

          const [showTestModal, setShowTestModal] = React.useState(false);
          const [currentProjForTest, setCurrentProjForTest] = React.useState(null);

          const [testForm, setTestForm] = React.useState({
            testType: 'เทสลูกปูน',
            sendDate: '',
            resultDate: '',
            specDetail: '',
            fieldDensityResult: '',
            slumpResult: '',
            curingDays: '28',
            asphaltTemp: '',
            marshallStability: '',
            status: 'รอผลแล็บ'
          });

          const defaultProjects = [
            {
              id: 1,
              name: 'โครงการก่อสร้างถนนคอนกรีตเสริมเหล็ก สาย ค',
              client: 'เทศบาลนครนครราชสีมา',
              budget: 4500000,
              stage: '3. ส่งเทสวัสดุ / ออกแบบ Mix Design',
              agingDays: 12,
              paymentStatus: 'กำลังดำเนินการหน้างาน',
              defectNote: 'เตรียมส่งตัวอย่างทดสอบตาม BOQ',
              finalHandoverDate: '',
              tests: [
                {
                  id: 101,
                  testType: 'เทสลูกปูน',
                  sendDate: '2026-11-10',
                  resultDate: '',
                  specDetail: 'รถผสมที่ 2, Sta. 0+100',
                  slumpResult: '7.5 ซม.',
                  curingDays: '28',
                  status: 'รอผลแล็บ'
                }
              ]
            }
          ];

          const [projects, setProjects] = React.useState(() => {
            const saved = localStorage.getItem('ktm_projects_v7');
            if (saved) return JSON.parse(saved);
            const oldV6 = localStorage.getItem('ktm_projects_v6');
            return oldV6 ? JSON.parse(oldV6) : defaultProjects;
          });

          React.useEffect(() => {
            localStorage.setItem('ktm_projects_v7', JSON.stringify(projects));
          }, [projects]);

          const fetchProjectsFromCloud = React.useCallback(async () => {
            setSyncStatus('กำลังซิงค์...');
            const { data, error } = await supabaseClient
              .from('projects')
              .select('*')
              .order('id', { ascending: false });

            if (error) {
              console.error('Supabase fetch error:', error);
              setSyncStatus('ออฟไลน์ / ตรวจสอบสิทธิ์');
              return;
            }

            if (data && data.length > 0) {
              setProjects(data.map(fromDbRow));
              setSyncStatus('Real-time พร้อมใช้งาน');
            } else {
              const localSaved = JSON.parse(localStorage.getItem('ktm_projects_v7') || 'null');
              const seedList = (localSaved && localSaved.length > 0) ? localSaved : defaultProjects;
              const { error: seedErr } = await supabaseClient
                .from('projects')
                .upsert(seedList.map(toDbRow), { onConflict: 'id' });
              if (!seedErr) {
                setProjects(seedList);
                setSyncStatus('Real-time พร้อมใช้งาน');
              } else {
                setSyncStatus('ซิงค์ไม่สำเร็จ');
              }
            }
          }, []);

          React.useEffect(() => {
            fetchProjectsFromCloud();

            const channel = supabaseClient
              .channel('ktm-projects-realtime')
              .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'projects' },
                () => {
                  fetchProjectsFromCloud();
                }
              )
              .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                  setSyncStatus('Real-time เชื่อมต่อแล้ว');
                }
              });

            return () => {
              supabaseClient.removeChannel(channel);
            };
          }, [fetchProjectsFromCloud]);

          const emptyForm = {
            name: '',
            client: '',
            budget: '',
            stage: '1. เตรียมการ / ออกหนังสือเข้าหน้างาน',
            paymentStatus: 'กำลังดำเนินการหน้างาน',
            agingDays: 0,
            defectNote: '-',
            finalHandoverDate: ''
          };

          const [formData, setFormData] = React.useState(emptyForm);

          const openAddForm = () => {
            setEditingId(null);
            setFormData(emptyForm);
            setShowForm(true);
          };

          const openEditForm = (proj) => {
            setEditingId(proj.id);
            setFormData({
              name: proj.name,
              client: proj.client,
              budget: proj.budget,
              stage: proj.stage || '1. เตรียมการ / ออกหนังสือเข้าหน้างาน',
              paymentStatus: proj.paymentStatus,
              agingDays: proj.agingDays,
              defectNote: proj.defectNote,
              finalHandoverDate: proj.finalHandoverDate
            });
            setShowForm(true);
          };

          const handleSaveProject = async (e) => {
            e.preventDefault();
            if (!formData.name || !formData.client) return;
            setIsSaving(true);

            const existingProj = projects.find(p => p.id === editingId);
            const projectPayload = {
              id: editingId ? editingId : Date.now(),
              name: formData.name,
              client: formData.client,
              budget: Number(formData.budget) || 0,
              stage: formData.stage,
              agingDays: Number(formData.agingDays) || 0,
              paymentStatus: formData.paymentStatus,
              defectNote: formData.defectNote || '-',
              finalHandoverDate: formData.finalHandoverDate,
              tests: existingProj ? existingProj.tests || [] : []
            };

            if (editingId) {
              setProjects(prev => prev.map(p => p.id === editingId ? projectPayload : p));
            } else {
              setProjects(prev => [projectPayload, ...prev]);
            }

            const { error } = await supabaseClient
              .from('projects')
              .upsert(toDbRow(projectPayload), { onConflict: 'id' });

            setIsSaving(false);
            if (error) {
              alert('บันทึกขึ้น Cloud ไม่สำเร็จ: ' + error.message);
            } else {
              setSyncStatus('บันทึกลง Cloud แล้ว');
            }

            setShowForm(false);
            setEditingId(null);
            setFormData(emptyForm);
          };

          const handleDeleteProject = async (id) => {
            if (!confirm('ยืนยันการลบโครงการนี้?')) return;
            setProjects(prev => prev.filter(p => p.id !== id));
            const { error } = await supabaseClient.from('projects').delete().eq('id', id);
            if (error) {
              alert('ลบข้อมูลบน Cloud ไม่สำเร็จ: ' + error.message);
              fetchProjectsFromCloud();
            }
          };

          const handleAddTestItem = async (e) => {
            e.preventDefault();
            if (!currentProjForTest || !testForm.sendDate) return;

            const newTest = {
              id: Date.now(),
              testType: testForm.testType,
              sendDate: testForm.sendDate,
              resultDate: testForm.resultDate,
              specDetail: testForm.specDetail || '-',
              fieldDensityResult: testForm.fieldDensityResult,
              slumpResult: testForm.slumpResult,
              curingDays: testForm.curingDays,
              asphaltTemp: testForm.asphaltTemp,
              marshallStability: testForm.marshallStability,
